version: 2
updates:
  # The actions in .github/workflows are pinned to a commit SHA; this moves the pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # JavaScript dependencies, read from package.json and package-lock.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  # The base images in Dockerfile.dev and Dockerfile.prod, pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
