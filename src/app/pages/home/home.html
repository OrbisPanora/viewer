<div class="home-container">
  <div class="content">
    <h1>OrbisPanora</h1>
    <p class="subtitle">Upload your Minecraft archive (.zip) file to visualize</p>

    <div
      class="drop-zone"
      [class.drag-over]="isDragOver"
      [class.uploading]="isUploading">

      <div class="drop-zone-content">
        <svg *ngIf="!isUploading" class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>

        <div *ngIf="isUploading" class="loading-spinner">
          <svg class="spinner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="0">
              <animate attributeName="stroke-dashoffset" values="0;32" dur="1s" repeatCount="indefinite" />
            </circle>
          </svg>
        </div>

        <h2 *ngIf="!isUploading">Drop your file here</h2>
        <h2 *ngIf="isUploading">Uploading world...</h2>

        <p *ngIf="!isUploading">or click to browse</p>
        <p *ngIf="isUploading">Please wait while we process your file</p>

        <p class="file-types">Supported: .zip</p>

        <input
          type="file"
          accept=".zip"
          (change)="onFileSelected($event)"
          class="file-input"
          [disabled]="isUploading">
      </div>
    </div>
  </div>
</div>
