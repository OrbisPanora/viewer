server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location /kubernetes/iut-inf63-projets-etudiants-orbispanora/orbispanora-web {
        alias /usr/share/nginx/html;
        
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        try_files $uri $uri/ /kubernetes/iut-inf63-projets-etudiants-orbispanora/orbispanora-web/index.html;
    }
    
    location = / {
        return 301 /kubernetes/iut-inf63-projets-etudiants-orbispanora/orbispanora-web/;
    }
}
