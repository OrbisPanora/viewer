# Template for the production image. The nginx image fills in ${API_UPSTREAM} at start
# (see Dockerfile.prod) and writes the result to /etc/nginx/conf.d/default.conf.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Uploads are sent in pieces of 5 MB (the API accepts up to 16 MB per piece), so the limit
    # is per request, not per world. Zips up to 1 MB are sent in one request.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # The API and its documentation pages. The pages load their own scripts, so they keep
    # the headers the API sends instead of the policy below.
    location ~ ^/(api|docs|redoc|openapi\.json) {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Unpacking a large world takes a while after the last piece arrives.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The same headers as `contentSecurityPolicy` and `securityHeaders` in vite.config.ts.
    # add_header in a location replaces those of the server block, so each location that
    # serves the app includes them.
    # Files built by Vite have a hash in their name and never change. The other files
    # (the icons) keep their name when their content changes, so they are not cached.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.[a-z0-9]+$" {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
